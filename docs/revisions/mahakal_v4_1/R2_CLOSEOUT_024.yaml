  source: full_L224
  target_dimension: 72
  nuisance_dimension: 152
  snr_label: 100
  actual_sigma: 0.011341986814407568
  rho: 1.0
  effect_amplitude: 1.0
  source_metric: registered_r_dr_dphi_dt
  target_selection: reuse_original_support_rule_and_exact_column_set
  geometry_uncertainty: not_included
  new_truths_or_retuning: forbidden

required_record_corrections:
  - Separate R0 starting commit from R1 and R2 execution identities.
  - Record that the R1 freeze omitted the R2 runner.
  - Record that the target manifest was written before spectra but not committed before execution.
  - Mark ten of ten as inventory coverage, not ten integration-tested runner paths.
  - Classify every calibration site as replay-tested, integration-tested, deferred, or retired.
  - Do not count deferred or retired exemptions as test passes.
  - Name information totals as normalized Fisher traces.
  - Keep numerical rank separate from operational fraction.
  - Treat PAIRING_DESTROYED as nonphysical, not as absent from all manuscript claims.

launch_sequence:
  A:
    - Commit the correction record and complete the missing guards and tests.
    - Prepare the identical target manifest without inspecting new spectra.
    - Freeze all new runners, numerical dependencies, configs, maps, tests and target bytes.
    - Commit that complete input snapshot and verify a clean registered tree.
  B:
    - Execute in a fresh output directory from the pinned clean snapshot.
    - Preserve the original numerical model and all declared tolerances.
    - Record actual execution commit, input hashes, versions, commands, runtime and memory.
    - Recompute direct and resolved spectra and compare with the archived candidate.
    - Emit actual measured residuals and test outcomes, not only PASS labels.
  C:
    - Commit outputs separately without changing the input freeze.
    - Return the numerical comparison and any differences, then stop.

gate_hardening:
  completion_requires:
    - prerequisite_test_success
    - verified_input_and_target_hashes
    - explicit_source_rank_and_nuisance_rank_decisions
    - finite_numeric_outputs
    - source_metric_promotion
    - stable_nuisance_rank_and_operational_counts_across_registered_tolerances
    - no_unresolved_blocker
  inject_failure_tests:
    - failed_R1_test
    - modified_or_missing_input
    - changed_target_columns
    - unpromoted_source_Gram
    - changed_nuisance_rank_with_unchanged_operational_count
    - changed_operational_count
    - existing_output_directory
  empty_target: explicit_non_success_scientific_disposition_without_reselection
  full_information_matrix_checks: required_in_small_fixtures_not_trace_only
  restore_protocol_fixture_tolerances: true
  G11_G14_fixture_rtol: 1.0e-10

replay_comparison:
  direct_target_columns: exactly_zero
  numerical_relative_tolerance: 1.0e-10
  numerical_absolute_tolerance: 1.0e-12
  near_zero_singular_values: absolute_tolerance_not_relative_error
  primary_operational_counts: [0, 2]
  changed_result: report_and_investigate_never_tune_to_expected_values
  interpretation: numerical_reproduction_not_new_independent_empirical_confirmation

mode_export:
  scope: same_operator_only_no_estimator
  export_top_modes: 3
  include:
    - singular_values_and_threshold_margins
    - right_singular_vectors_and_source_coefficient_vectors
