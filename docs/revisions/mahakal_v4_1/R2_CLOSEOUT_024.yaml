    - known_and_conditional_information_on_each_same_exported_direction
    - subspace_angles_across_rank_tolerances_and_last_two_metric_refinements
  sign_rule: largest_absolute_source_coefficient_positive
  near_degenerate_modes: compare_subspaces_not_individual_signed_vectors
  interpretation: signed_source_perturbations_not_reconstructed_histories

additional_authorization:
  raw_RayMap_metadata_inventory: allowed
  inspect_fields: [alpha, beta, pixel_area, valid, coordinate_time, delay]
