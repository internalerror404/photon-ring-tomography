phases:
  Q0:
    tasks:
      - Inventory geometric versus stored weights in all maps used by claimed results.
      - Verify alpha and beta spacing separately, uniformity, duplicates and ordering.
      - Trace pinned generator endpoint semantics and finite domain per profile.
      - Separate nominal request pitch, realized nodes, cell edges and effective sampled quadrature.
      - Assign immutable source hashes and map-to-runner-to-claim dependencies.
      - Mark raw mask validity distinct from fractional geometric coverage.
      - Map area changes to weights, outer domain and masks separately.
    inputs: existing_archived_maps_only
    outputs: [C13_MAP_MEASURE_INVENTORY.json, C13_CLAIM_DEPENDENCY_OVERLAY.md]
  Q1:
    tasks:
      - Build corrected geometric records without rewriting HDF5 archives.
      - Use node dual cells clipped to declared finite boundaries when nodes include endpoints.
      - Use full center cells only with an explicit fixed domain and justified coverage.
      - Support rectangular or variable-area boundary cells, not sqrt_area squares by default.
      - Use common-refinement integration internally where useful.
      - Test invariant fixed-detector integration under same-field cell subdivision.
      - Verify inherited-noise brightness and integrated-flux representations agree.
      - Verify detector noise is assigned once after the physical sum.
      - Record original and corrected measure separately; no rescaled endpoint claims.
    scalar_spacing_only_diagnostic:
      purpose: isolate_interior_pitch_error_not_complete_physical_correction
      core_factors: ['1', '(250/249)^2', '(700/699)^2']
      reference_sigma_unchanged_when_only_these_factors_apply: true
      conditional_information_bound: r_min_F_old_le_F_new_le_r_max_F_old
      counts_certified_only_under_bound_assumptions: [0, 2]
      excludes: [boundary_clipping, changed_masks, new_rays, new_detector, estimator_errors]
    outputs: [C13_MEASURE_SPECIFICATION.json, GEOMETRIC_CELL_SIDECAR_MANIFEST.json, C13_UNIT_AND_GEOMETRY_TESTS.json]
  Q2:
    tasks:
      - Freeze D026, corrected measures, existing profiles, clock reference and field suite.
      - Compare existing coarse/core/fine profiles at identical detector and actual sigma.
      - Use fixed absolute observer-time origin, not each profile's sampled maximum.
      - Retain and reconcile signed time offsets instead of clipping or recentering them.
      - Measure per-order mask symmetric differences and corrected active area.
      - Compare every field response vector, not only total trace.
      - Report insufficient refinement explicitly; three levels are not proof of divergence.
    field_suite:
      screen_fields: ['1', 'alpha/25', 'beta/25', '(alpha/25)^2', '(beta/25)^2', 'alpha*beta/625']
      transferred_fields: ['g^3', 'g^3*cos(2*pi*(t_obs-delay)/20)', 'g^3*sin(2*pi*(t_obs-delay)/20)', 'g^3*cos(2*pi*(t_obs-delay)/40)', 'g^3*sin(2*pi*(t_obs-delay)/40)']
      valid_mask: apply_explicitly_to_every_field
      all_orders_and_times: required
      no_chosen_target_modes: true
    metrics:
      response_error: norm_W_yfine_minus_W_ycoarse_over_max_norm_W_yfine_floor
      response_floor: 1e-12_times_same_order_constant_mask_response_norm
      mask_error: symmetric_difference_area_over_union_area_on_fixed_domain
      area_error: absolute_area_difference_over_larger_corrected_area
      empty_mask_or_zero_signal: explicit_empty_case_not_silent_division_floor
      interpolation_holes: report_separately_never_hide_in_area_total
    outputs: [FIXED_DETECTOR_PROFILE_CONVERGENCE.json, BOUNDARY_AND_MASK_ERROR_LEDGER.json]
  Q3:
    status: conditional_bounded_same_geometry_numerical_refinement_authorized
    triggers:
      - Q0_and_Q1_pass_and_existing_profiles_fail_new_Q2_accuracy_criteria
      - complete_preexecution_plan_and_dependencies_committed
      - pinned_tracer_can_evaluate_declared_points_without_changing_physics
      - no_paid_resource_acquisition
    allowance:
      total_new_screen_order_ray_evaluations_maximum: 250000
      batches_maximum: 2
      evaluations_per_batch_maximum: 125000
      peak_memory_GiB_maximum: 8
      wall_clock_hours_maximum: 2
      tracing_implementation: same_pinned_backend_and_physical_model
      refinement: nested_or_error_estimated_at_fixed_detector
      selection: validity_boundaries_geometry_and_declared_field_residuals_only
      candidate_target_information_selection: forbidden
      count_all_queries_including_invalid_and_retried: true
      all_orders_accounted_for: true
      additional_screens_are_finer_numerics_not_new_geometry: true
    requirements:
      - Freeze refinement rule, tie breaking, budget and map origins before queries.
      - Record prospective nodes, exact areas and per-node solver/validity status.
      - Separate lensing-boundary discretization from transfer-field integration.
      - Include a shifted or independent boundary check not sharing the same nested-grid alias.
      - Preserve earlier levels and failures.
      - Existing profiles and every newly used dependency must appear in the input freeze.
    cap_or_capability_failure: return_R3A_QC_REFINEMENT_BUDGET_OR_CAPABILITY_BLOCKED
    outputs: [NEW_RAY_EVALUATION_PROVENANCE.json, FIXED_DETECTOR_REFINEMENT_REPORT.json]
